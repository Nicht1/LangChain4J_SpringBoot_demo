server:
  port: 8081


spring:
  datasource:
    url: jdbc:mysql://localhost:3306/llm?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123321
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ============================================================
  # 文件上传大小限制（客户上传文档用）
  #   ⚠️ Boot 默认是 max-file-size=1MB / max-request-size=10MB，两个都必须放开；
  #      只设前者的话，20MB 的文件仍会被 10MB 的 request 上限挡住。
  #   max-file-size 用占位符引用 llm.rag.upload.max-file-size，保持单一来源——
  #      避免"改了一处忘了另一处"，那会让容器先拒掉文件、应用层的友好提示根本执行不到。
  #   max-request-size 需大于 file 上限（multipart 还要带 boundary 和表单字段）。
  # ============================================================
  servlet:
    multipart:
      max-file-size: ${llm.rag.upload.max-file-size}
      max-request-size: 25MB

  # ============================================================
  # Redis 连接（会话记忆存储）
  #   默认共享单连接 + 命令流水线，对当前量级足够。
  #   如需连接池请额外引入 org.apache.commons:commons-pool2，
  #   否则 lettuce.pool.* 配置会被静默忽略。
  # ============================================================
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      # password:
      timeout: 3s
      connect-timeout: 3s

langchain4j:
  openai:
    # 本模块只需流式聊天模型（DeepSeek），不配置 chat-model
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key:
      model-name: deepseek-chat
      temperature: 0.7
      max-tokens: 1000
      timeout: 60s
      log-requests: true
      strict-tools: true
      log-responses: true

  # ============================================================
  # 模型分工：
  #   聊天/流式模型 → DeepSeek（streaming-chat-model）
  #   向量模型      → BGE-small-zh（本地 ONNX，512维，见 EmbeddingStoreConfig）
  #   向量库        → Milvus
  #   指纹          → MySQL（rag_document_fingerprint 表）
  # ============================================================
  milvus:
    host: localhost
#    host: 117.72.157.7
    port: 19530
    # token: your-token          # 如有认证需求取消注释
    database-name: my_rag_db
    collection-name: llm_rag_docs_v2
    dimension: 512                # 向量维度，BGE-small-zh=512（需删除旧集合重新创建）
    reload-on-startup: true       # 启动时重新加载文档到 Milvus（基于指纹增量，幂等）
    document-path: D:\work\LLM-Spring\llm-mini\src\main\resources\documentation


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    auto-mapping-behavior: full
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:/mapper/xml/*.xml
  global-config:
    db-config:
      logic-not-delete-value: 0
      logic-delete-value: 1

# ============================================================
# 聊天记忆
#   store         —— 存储后端：redis（默认，推荐）| mysql
#                    redis：List + 一条 Lua（DEL+RPUSH+LTRIM+EXPIRE），原子、单次往返，
#                           天然"只保留最近 N 条"，无需 diff / 索引 / 本地锁
#                    mysql：行级表 + 摊销修剪，仅当需要按消息查询/审计/多端同步时才用
#                           配套索引脚本 resources/sql/chat_memory_index.sql
#   max-messages  —— 语义上限：内存窗口大小 = 存储层保留条数 = 读取条数（三者必须一致）
#   trim-interval —— 摊销间隔（仅 mysql 后端有意义）
# ============================================================
llm:
  memory:
    store: redis
    max-messages: 20              # 每个会话只保留最近 20 条记忆
    trim-interval: 20             # 仅 mysql 后端：每累计写入 20 条才批量修剪一次
    redis:
      key-prefix: "llm:chat:memory:"
      ttl: 7d                     # 滑动过期：每次写入刷新；0 = 永不过期
  # ============================================================
  # 动态智能体 / 多租户 RAG 默认归属
  #   摄入文档时给向量打 userId / agentId 标签，检索时按 @Value("userId")/@V("agentId") 过滤
  #   （与 MessageRequestVO 的默认 userId=123、agentId=1 保持一致，保证默认对话 RAG 可用）
  # ============================================================
  rag:
    default-user-id: 123
    default-agent-id: 1

    # ==========================================================
    # 客户上传文档（多租户 RAG 知识库）
    #   代码：RagUploadProperties / RagDocumentService / AliyunOssDocumentStorage
    #   接口：/api/rag/document/{upload,list,get,delete,retry}
    #
    #   存储约定：客户上传的原始文档只存阿里云 OSS，不落应用本地磁盘。
    #             官方文档走另一条路——放进 llm-mini/src/main/resources/documentation，
    #             由启动自检（EmbeddingStoreConfig）增量同步进 Milvus + MySQL 指纹表。
    #
    #   ★ 本段除 OSS 凭据外都有代码默认值，不配也能启动。
    #
    #   ⚠️ 关于 ${ENV:兜底} 的两条规矩：
    #      ① 非密钥、且确实有合理兜底的（地域节点、key 前缀）→ 写 ${ENV:兜底值}，
    #         没设环境变量就用兜底值，兜底值本身没有保密问题、还能当文档。
    #      ② 密钥或必须由你提供的（access-key-id / secret / bucket）→ 用 ${ENV:} 空兜底。
    #         绝不能写 ${ENV:真实值} —— 那等于把密钥明文留在 yml 里、随 Git 提交出去。
    #         空兜底的效果：没配时是空串 → 启动时明确报"未配置 xxx"，且不影响聊天与内置知识库。
    #   ⚠️ bucket 必须保持私有读，不要设成公共读。
    # ==========================================================
    upload:
      max-file-size: 20MB                 # 单文件上限（会同步到 multipart 限制）
      max-documents-per-user: 200         # 单用户文档数配额
      chunk-size: 300                     # 分片长度（字符）
      chunk-overlap: 30                   # 相邻分片重叠（字符）
      allowed-extensions: pdf,docx,doc,txt,md,markdown,html,htm,xlsx,xls,pptx,ppt,csv
      oss:
        endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}   # 地域节点，非密钥可给兜底
        key-prefix: ${OSS_KEY_PREFIX:rag-docs}                   # 对象 key 前缀，非密钥
        access-key-id: ${OSS_ACCESS_KEY_ID:}                     # 空兜底：不落明文
        access-key-secret: ${OSS_ACCESS_KEY_SECRET:}             # 空兜底：不落明文
        bucket-name: ${OSS_BUCKET:}                              # 空兜底：不落明文

logging:
  level:
    root: info
